name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; the token can't write contents, packages, or PRs
permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  # `dotnet test` (~63s) and the Native AOT publish (~42s) used to run back to
  # back in one job, making it the critical path at ~128s. They share no state —
  # the publish compiles Release from source and never reads the test output —
  # so they run as two jobs and the pair costs whichever is slower. Only the
  # test half needs PostgreSQL, so the AOT half also skips container startup.
  server-test:
    name: server — dotnet test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # There is no packages.lock.json, so setup-dotnet's own cache cannot key
      # itself; cache the global package folder against the project files
      # instead. restore-keys lets an unrelated csproj edit reuse the previous
      # download rather than refetching every package.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj', 'server/**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Test against PostgreSQL 18
        working-directory: server
        env:
          EP_TEST_CONNSTRING: Host=localhost;Port=5432;Username=ci;Password=ci;Database=postgres;Maximum Pool Size=20;
        run: dotnet test --nologo

  server-aot:
    name: server — Native AOT publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj', 'server/**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # `apt-get update` alone has taken >15 minutes on degraded runners and is
      # the single largest source of CI wall-clock here, so pay it only for what
      # the image genuinely lacks. ubuntu-latest already ships clang and the
      # zlib headers; this keeps working if a future image drops either.
      - name: Native AOT prerequisites (install only what the image lacks)
        run: |
          missing=""
          command -v clang >/dev/null 2>&1 || missing="$missing clang"
          [ -f /usr/include/zlib.h ] || missing="$missing zlib1g-dev"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo apt-get update -q
            sudo apt-get install -y -q $missing
          else
            echo "clang and zlib headers already present — skipping apt"
          fi
      - name: Native AOT publish (zero warnings — TreatWarningsAsErrors)
        run: |
          dotnet publish server/src/EventPump -c Release -o /tmp/aot-publish
          # usage exit code 64 proves the native binary actually runs
          /tmp/aot-publish/eventpump || test $? -eq 64

  web-sdk:
    name: web SDK — vitest + size budget + Playwright
    runs-on: ubuntu-latest
    # The browser download is the long pole here, so the budget has to cover a
    # cold cache: a loaded runner spent >15m in `playwright install` alone and
    # the job was killed before a single test ran.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/web/package-lock.json
      - run: npm ci
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      # Keyed on the resolved version, not the lockfile hash: browsers are tied
      # to the Playwright release, so an unrelated dependency bump must not
      # throw the download away.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}
      - run: npm test
      - name: Build (fails if ep.js exceeds the 8KB gzip budget)
        run: npm run build
      # No `--with-deps`: that is an apt call, and apt is what actually costs
      # the time here — a cache-hit run still sat in `install-deps` for 15+
      # minutes while the browser itself came back from the cache instantly.
      # ubuntu-latest already carries Chromium's shared libraries. If a future
      # image stops doing so, the launch fails fast and loudly in the next step
      # rather than silently, and the fix is to restore --with-deps here.
      - name: Install Chromium (browser only — no apt)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright test

  ui:
    name: events UI — vitest + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  flutter-sdk:
    name: flutter SDK — analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  smoke:
    name: end-to-end smoke (all three producer paths)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/web/package-lock.json
      # smoke.sh does its own `dotnet publish`, so it pays a restore too.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('server/**/*.csproj', 'server/**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # Same reasoning as the server jobs: apt is the bottleneck, so touch it
      # only for what the image is actually missing. ubuntu-latest ships clang,
      # the zlib headers and a psql client; smoke.sh needs all three.
      - name: Prerequisites (install only what the image lacks)
        run: |
          missing=""
          command -v clang >/dev/null 2>&1 || missing="$missing clang"
          [ -f /usr/include/zlib.h ] || missing="$missing zlib1g-dev"
          command -v psql  >/dev/null 2>&1 || missing="$missing postgresql-client"
          if [ -n "$missing" ]; then
            echo "installing:$missing"
            sudo apt-get update -q
            sudo apt-get install -y -q $missing
          else
            echo "clang, zlib headers and psql already present — skipping apt"
          fi
      - name: Web SDK deps + Playwright chromium (browser only — no apt)
        working-directory: sdks/web
        run: |
          npm ci
          npx playwright install chromium
      - name: Run smoke (compose PostgreSQL 18 -> AOT binaries -> headless IIFE
          + flutter-format batch + SQL contract -> mock destinations)
        run: ./deploy/smoke.sh
